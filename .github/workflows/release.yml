name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without v; must match VERSION
        required: true
        default: "1.0.0"
        type: string
      evidence_reviewed:
        description: I reviewed the recorded hardware evidence and unverified scenarios
        required: true
        default: false
        type: boolean
      hardware_notes:
        description: Actual tested models/firmware and results or evidence link (no secrets)
        required: true
        type: string
      unverified_hardware:
        description: Hardware scenarios not verified for this release
        required: true
        default: Wall-controller proxy; serial-disconnect recovery; installer/reset commands; long-term operation
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require merged master, consistent metadata and hardware evidence
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          EVIDENCE_REVIEWED: ${{ inputs.evidence_reviewed }}
          HARDWARE_NOTES: ${{ inputs.hardware_notes }}
          UNVERIFIED_HARDWARE: ${{ inputs.unverified_hardware }}
        run: |
          test "$GITHUB_REF" = refs/heads/master
          test "$EVIDENCE_REVIEWED" = true
          test -n "$HARDWARE_NOTES"
          test -n "$UNVERIFIED_HARDWARE"
          python .github/scripts/check_release.py "$REQUESTED_VERSION"

  checks:
    needs: prepare
    uses: ./.github/workflows/esphome.yml

  publish:
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish a new immutable version from the checked commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          HARDWARE_NOTES: ${{ inputs.hardware_notes }}
          UNVERIFIED_HARDWARE: ${{ inputs.unverified_hardware }}
        shell: bash
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)"
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            echo "Master changed during validation; rerun Release on the latest master." >&2
            exit 1
          fi
          tag="v$RELEASE_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists; published tags must not be moved." >&2
            exit 1
          else
            result=$?
            if [[ "$result" != 2 ]]; then exit "$result"; fi
          fi
          printf '\n## Hardware validation\n\n%s\n' "$HARDWARE_NOTES" >> RELEASE_NOTES.md
          printf '\n## Hardware verification limits\n\n%s\n' "$UNVERIFIED_HARDWARE" >> RELEASE_NOTES.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file RELEASE_NOTES.md
