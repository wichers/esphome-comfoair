name: Release

on:
  push:
    branches: [master]
    paths: [VERSION]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Validate changed version and release metadata
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          tag="$(python .github/scripts/check_release.py \
            --previous-ref "$BEFORE")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/esphome.yml

  publish:
    needs: [prepare, checks]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish a new immutable version from the checked commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)"
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            echo "Master changed during validation; rerun Release on the latest master." >&2
            exit 1
          fi
          tag="$RELEASE_TAG"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists; published tags must not be moved." >&2
            exit 1
          else
            result=$?
            if [[ "$result" != 2 ]]; then exit "$result"; fi
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file RELEASE_NOTES.md
