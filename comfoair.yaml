# esphome> esphome run comfoair.yaml
esphome:
  name: comfoair

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

# Enable Web server.
web_server:
  port: 80
  
# Sync time with Home Assistant.
time:
  - platform: homeassistant
    id: homeassistant_time

# Button to restart.
button:
  - platform: restart
    name: Restart
  - platform: template
    name: "Reset Filter"
    on_press:
      then:
        - lambda: |-
                id(comfoair_climate)->filter_reset();
                    
# Text sensors with general information.
text_sensor:
  # Expose ESPHome version as sensor.
  #- platform: version
  #  name: "ESPHome version"
  # Expose WiFi information as sensors.
  - platform: wifi_info
    ip_address:
      name: IP address

sensor:
  - platform: wifi_signal
    name: "WiFi Signal Sensor"
    update_interval: 60s

external_components:
  - source:
      type: local
      path: components
    components: [comfoair]

uart:
  id: uart_bus
  tx_pin: D1
  rx_pin: D2
  baud_rate: 9600

comfoair:
  name: "ComfoAir 350"
  id: "comfoair_climate"
  uart_id: uart_bus
  type:
    name: "type"
  size:
