# Copy to secrets.yaml and replace every placeholder before installing.
# Generate the API encryption key with: openssl rand -base64 32
wifi_ssid: YOUR_WIFI_NAME
wifi_password: REPLACE_WITH_YOUR_WIFI_PASSWORD
wifi_fallback_ap_key: REPLACE_WITH_A_UNIQUE_AP_PASSWORD
comfoair_ota_password: REPLACE_WITH_A_UNIQUE_OTA_PASSWORD
comfoair_api_encryption_key: REPLACE_WITH_A_GENERATED_BASE64_KEY
web_server_username: YOUR_WEB_USERNAME
web_server_password: REPLACE_WITH_A_UNIQUE_WEB_PASSWORD
mqtt_host: YOUR_BROKER_ADDRESS
mqtt_username: YOUR_MQTT_USERNAME
mqtt_password: REPLACE_WITH_YOUR_MQTT_PASSWORD
