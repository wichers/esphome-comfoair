esphome:
  name: comfoair-protocol
  includes:
    - protocol_test.h
  on_boot:
    priority: 800
    then:
      - lambda: |-
          run_protocol_tests();
          exit(0);
host:
logger:
external_components:
  - source:
      type: local
      path: ../components
    components: [comfoair]
uart:
  id: uart_bus
  port: /dev/null
  baud_rate: 9600
comfoair:
  name: Protocol test
  uart_id: uart_bus
